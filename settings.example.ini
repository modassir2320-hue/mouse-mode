[General]
toggleKey=^!o
holdMs=500
colorCursor=1

[Cursor]
; Easiest way to change these: tray icon > "Customize cursor..."
; colors are RRGGBB hex. size: 1 small, 2 medium, 3 large, 4 extra large
; style: 1 split left|right, 2 split top|bottom, 3 one solid color. outline: 1 black, 2 white, 3 none
color1=1E64FF
color2=E61E1E
size=1
style=1
outline=1

[Custom]
; Up to 3 shortcuts in the radial menu. Easiest way: choose the "Add app" slice in the menu.
; A target can be an app, a file, a folder, or a website (https://...)
target1=
name1=
target2=
name2=
target3=
name3=
